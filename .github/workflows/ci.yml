name: CI Pipeline

on:
  pull_request:
    branches: [ develop, master ]
  push:
    branches: [ develop, master ]

permissions:
  contents: read
  pull-requests: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # 检测变更路径
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server-changed: ${{ steps.changes.outputs.server }}
      web-changed: ${{ steps.changes.outputs.web }}
      admin-changed: ${{ steps.changes.outputs.admin }}
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 检测文件变更
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          server:
            - 'vocata-server/**'
            - 'pom.xml'
            - 'scripts/**'
            - '.github/workflows/ci.yml'
          web:
            - 'vocata-web/**'
            - 'scripts/**'
            - '.github/workflows/ci.yml'
          admin:
            - 'vocata-admin/**'
            - 'scripts/**'
            - '.github/workflows/ci.yml'

  # 提交规范校验（PR 标题 + commit message 格式，纯 shell 无额外依赖）
  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 校验 PR 标题与提交信息
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        PATTERN='^(feat|fix|refactor|docs|test|chore|style|perf|build|ci|revert)(\([a-z0-9_-]+\))?: .+'
        echo "格式要求: <type>(可选scope): <summary>"
        echo "允许类型: feat fix refactor docs test chore style perf build ci revert"
        echo ""
        FAILED=0

        echo "PR 标题: $PR_TITLE"
        if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
          echo "  ✅ 符合规范"
        else
          echo "  ❌ PR 标题不符合 <type>: <summary> 规范"
          FAILED=1
        fi
        echo ""

        git fetch origin "$BASE_REF" --quiet || true
        COMMITS=$(git log --no-merges --format=%s "origin/${BASE_REF}..HEAD")
        if [ -z "$COMMITS" ]; then
          echo "无新增非合并提交，跳过 commit 校验"
        else
          echo "提交信息:"
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qE "$PATTERN"; then
              echo "  ✅ $msg"
            else
              echo "  ❌ $msg"
              FAILED=1
            fi
          done <<< "$COMMITS"
        fi
        echo ""

        if [ "$FAILED" -ne 0 ]; then
          echo "::error::提交规范校验失败，请参考 docs/提交规范.md"
          exit 1
        fi
        echo "🎉 提交规范校验通过"

  # 密钥泄露扫描（gitleaks，仅扫描本 PR 引入的变更）
  secret-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 安装 gitleaks
      run: |
        set -euo pipefail
        VERSION=8.21.2
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: 扫描 PR 引入的密钥
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        git fetch origin "$BASE_REF" --quiet || true
        echo "扫描范围: origin/${BASE_REF}..HEAD"
        gitleaks detect --redact --no-banner -v \
          --log-opts="origin/${BASE_REF}..HEAD" --exit-code 1

  # 后端服务CI
  backend-ci:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.server-changed == 'true'

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: 缓存 Maven 依赖
      uses: actions/cache@v4
      with:
        path: /tmp/juhao_m2repo
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: 运行后端验证脚本
      run: ./scripts/validate-backend.sh

  # 前端客户端CI
  frontend-web-ci:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web-changed == 'true'

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: vocata-web/package-lock.json

    - name: 安装依赖
      working-directory: ./vocata-web
      run: npm ci

    - name: 运行用户端验证脚本
      run: ./scripts/validate-web.sh

  # 管理后台CI
  frontend-admin-ci:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.admin-changed == 'true'

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: vocata-admin/package-lock.json

    - name: 安装依赖
      working-directory: ./vocata-admin
      run: npm ci

    - name: 运行管理端验证脚本
      run: ./scripts/validate-admin.sh

  # CI 结果汇总
  ci-summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, commit-lint, secret-scan, backend-ci, frontend-web-ci, frontend-admin-ci]
    if: always()

    steps:
    - name: CI 结果汇总
      run: |
        echo "## 🔍 CI 检查结果" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| 组件 | 变更状态 | CI状态 |" >> $GITHUB_STEP_SUMMARY
        echo "|------|----------|--------|" >> $GITHUB_STEP_SUMMARY

        # 检查各组件状态
        FAILED=false

        # 提交规范 / 密钥扫描（仅 PR 触发，skipped 视为通过）
        if [[ "${{ needs.commit-lint.result }}" == "failure" ]]; then
          echo "| 提交规范 | 全局 | ❌ 失败 |" >> $GITHUB_STEP_SUMMARY
          FAILED=true
        elif [[ "${{ needs.commit-lint.result }}" == "success" ]]; then
          echo "| 提交规范 | 全局 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| 提交规范 | 全局 | ⏭️ 跳过 |" >> $GITHUB_STEP_SUMMARY
        fi

        if [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
          echo "| 密钥扫描 | 全局 | ❌ 失败 |" >> $GITHUB_STEP_SUMMARY
          FAILED=true
        elif [[ "${{ needs.secret-scan.result }}" == "success" ]]; then
          echo "| 密钥扫描 | 全局 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| 密钥扫描 | 全局 | ⏭️ 跳过 |" >> $GITHUB_STEP_SUMMARY
        fi

        # 后端服务
        if [[ "${{ needs.detect-changes.outputs.server-changed }}" == "true" ]]; then
          if [[ "${{ needs.backend-ci.result }}" == "success" ]]; then
            echo "| 后端服务 | 有变更 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 后端服务 | 有变更 | ❌ 失败 |" >> $GITHUB_STEP_SUMMARY
            FAILED=true
          fi
        else
          echo "| 后端服务 | 无变更 | ⏭️ 跳过 |" >> $GITHUB_STEP_SUMMARY
        fi

        # 前端客户端
        if [[ "${{ needs.detect-changes.outputs.web-changed }}" == "true" ]]; then
          if [[ "${{ needs.frontend-web-ci.result }}" == "success" ]]; then
            echo "| 前端客户端 | 有变更 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 前端客户端 | 有变更 | ❌ 失败 |" >> $GITHUB_STEP_SUMMARY
            FAILED=true
          fi
        else
          echo "| 前端客户端 | 无变更 | ⏭️ 跳过 |" >> $GITHUB_STEP_SUMMARY
        fi

        # 管理后台
        if [[ "${{ needs.detect-changes.outputs.admin-changed }}" == "true" ]]; then
          if [[ "${{ needs.frontend-admin-ci.result }}" == "success" ]]; then
            echo "| 管理后台 | 有变更 | ✅ 通过 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 管理后台 | 有变更 | ❌ 失败 |" >> $GITHUB_STEP_SUMMARY
            FAILED=true
          fi
        else
          echo "| 管理后台 | 无变更 | ⏭️ 跳过 |" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ "$FAILED" == "false" ]]; then
          echo "🎉 **CI检查通过**，可以合并PR！" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **CI检查失败**，请修复后重新提交" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

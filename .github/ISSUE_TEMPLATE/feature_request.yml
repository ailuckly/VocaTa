name: Feature request
description: Propose a focused improvement for VocaTa.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the smallest useful version of the change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      multiple: true
      options:
        - backend
        - vocata-web
        - vocata-admin
        - WebSocket / streaming
        - STT / LLM / TTS provider
        - Docker / local environment
        - CI / deployment
        - documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
  - type: textarea
    id: risks
    attributes:
      label: Risks / Rollback
      description: Mention API, auth, data, cost, deployment, or provider risks.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight Checks
      options:
        - label: This request is focused on one problem.
          required: true
        - label: I am not requesting a secret, production credential, or private config to be committed.
          required: true

name: Bug report
description: Report a reproducible problem in VocaTa.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Do not include secrets, tokens,
        private keys, production config, or full `.env` contents.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      multiple: true
      options:
        - backend
        - vocata-web
        - vocata-admin
        - WebSocket / streaming
        - STT / LLM / TTS provider
        - Docker / local environment
        - CI / deployment
        - documentation
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch / Commit
      placeholder: develop @ abc1234
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste relevant logs with secrets redacted.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight Checks
      options:
        - label: I removed secrets and private data from this report.
          required: true
        - label: I checked the relevant documentation or existing issues first.
          required: true
